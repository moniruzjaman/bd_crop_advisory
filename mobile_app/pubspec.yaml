
name: crop_advisory_bd
description: National AI-Enabled Crop Health Advisory System for Bangladesh

publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # Camera and Image
  camera: ^0.10.5+5
  image_picker: ^1.0.4

  # Networking
  http: ^1.1.0
  dio: ^5.3.3

  # State Management
  provider: ^6.0.5
  flutter_bloc: ^8.1.3

  # Location
  geolocator: ^10.1.0
  geocoding: ^2.1.1

  # Storage
  shared_preferences: ^2.2.2
  hive: ^2.2.3
  hive_flutter: ^1.1.0

  # UI Components
  flutter_svg: ^2.0.9
  cached_network_image: ^3.3.0
  shimmer: ^3.0.0

  # Utilities
  intl: ^0.18.1
  permission_handler: ^11.0.1
  path_provider: ^2.1.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.1
  build_runner: ^2.4.7
  hive_generator: ^2.0.1

flutter:
  uses-material-design: true

  fonts:
    - family: Kalpurush
      fonts:
        - asset: assets/fonts/Kalpurush-Regular.ttf
        - asset: assets/fonts/Kalpurush-Bold.ttf
          weight: 700

  assets:
    - assets/images/
    - assets/icons/
    - assets/fonts/
