
version: '3.8'

services:
  api:
    build: .
    container_name: crop_advisory_api
    ports:
      - "8000:8000"
    environment:
      - DATABASE_URL=postgresql://postgres:password@db:5432/crop_advisory
      - REDIS_URL=redis://redis:6379/0
      - SECRET_KEY=${SECRET_KEY}
      - WHATSAPP_TOKEN=${WHATSAPP_TOKEN}
      - WHATSAPP_PHONE_NUMBER_ID=${WHATSAPP_PHONE_NUMBER_ID}
    depends_on:
      - db
      - redis
    volumes:
      - ./uploads:/app/uploads
    restart: unless-stopped
    networks:
      - crop_network

  db:
    image: postgres:15-alpine
    container_name: crop_advisory_db
    environment:
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=password
      - POSTGRES_DB=crop_advisory
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    restart: unless-stopped
    networks:
      - crop_network

  redis:
    image: redis:7-alpine
    container_name: crop_advisory_redis
    ports:
      - "6379:6379"
    restart: unless-stopped
    networks:
      - crop_network

  nginx:
    image: nginx:alpine
    container_name: crop_advisory_nginx
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
      - ./ssl:/etc/nginx/ssl:ro
    depends_on:
      - api
    restart: unless-stopped
    networks:
      - crop_network

volumes:
  postgres_data:

networks:
  crop_network:
    driver: bridge
